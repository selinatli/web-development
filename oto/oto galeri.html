
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Araba Projesi</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            background-color:#f4f4f4;
            padding:30px;
        }

        .container{
            width:90%;
            margin:auto;
            background:white;
            border:1px solid #ddd;
            padding:20px;
        }

        h2{
            margin-bottom:20px;
            color:#333;
        }

        .form-group{
            display:flex;
            gap:10px;
            margin-bottom:15px;
        }

        input{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:3px;
            font-size:16px;
        }

        .btn-ekle{
            background:#c0392b;
            color:white;
            border:none;
            padding:12px 20px;
            cursor:pointer;
            border-radius:3px;
            margin-bottom:20px;
        }

        .btn-ekle:hover{
            background:#962d22;
        }

        table{
            width:100%;
            border-collapse:collapse;
            margin-top:20px;
        }

        thead{
            background:#111;
            color:white;
        }

        th, td{
            padding:15px;
            text-align:left;
            border:1px solid #ddd;
        }

        img{
            width:120px;
            height:70px;
            object-fit:cover;
        }

        .btn-temizle{
            margin-top:20px;
            background:#111;
            color:white;
            border:none;
            padding:12px 20px;
            cursor:pointer;
            border-radius:3px;
        }

        .btn-temizle:hover{
            background:#333;
        }
    </style>
</head>
<body>

    <div class="container">

        <h2>Araç Projesi</h2>

        <div class="form-group">
            <input type="text" id="aracIsmi" placeholder="Araç İsmi">
            <input type="text" id="fiyatBilgisi" placeholder="Fiyat Bilgisi">
        </div>

        <div class="form-group">
            <input type="text" id="gorselLink" placeholder="Araç Görseli Linki">
        </div>

        <button class="btn-ekle" id="ekleBtn">Araç Ekleyin</button>

        <hr><br><br>

        <h2>Araçlar</h2>

        <table>
            <thead>
                <tr>
                    <th>Araç Görseli</th>
                    <th>Araç Bilgisi</th>
                    <th>Fiyat Bilgisi</th>
                </tr>
            </thead>

            <tbody id="aracListesi">

            </tbody>
        </table>

        <button class="btn-temizle" id="temizleBtn">
            Tüm Araçları Temizleyin
        </button>

    </div>


    <script>

        const ekleBtn = document.getElementById("ekleBtn");
        const temizleBtn = document.getElementById("temizleBtn");
        const aracListesi = document.getElementById("aracListesi");


        ekleBtn.addEventListener("click", function(){

            const aracIsmi = document.getElementById("aracIsmi").value;
            const fiyatBilgisi = document.getElementById("fiyatBilgisi").value;
            const gorselLink = document.getElementById("gorselLink").value;


            if(aracIsmi === "" || fiyatBilgisi === "" || gorselLink === ""){
                alert("Lütfen tüm alanları doldurun!");
                return;
            }


            const satir = document.createElement("tr");

            satir.innerHTML = `
                <td>
                    <img src="${gorselLink}" alt="Araç">
                </td>
                <td>${aracIsmi}</td>
                <td>${fiyatBilgisi}</td>
            `;

            aracListesi.appendChild(satir);


            document.getElementById("aracIsmi").value = "";
            document.getElementById("fiyatBilgisi").value = "";
            document.getElementById("gorselLink").value = "";

        });


        temizleBtn.addEventListener("click", function(){
            aracListesi.innerHTML = "";
        });

    </script>

</body>
</html>
