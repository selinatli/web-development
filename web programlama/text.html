<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>text</title>
    <style>
        div{
            width: 800px;
            height: 300px;
            border: 2px solid black;
        }
        p{
            font-size: 22px;
            text-align: center;
            letter-spacing: 2px;
            word-spacing: 3px;
        }
        h2{
            font-style: italic;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div>
        <h2>Lorem ipsum dolor sit amet.</h2>

        <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Libero ea, velit vero provident unde temporibus
            cupiditate deserunt consectetur, inventore et laborum repellat harum iure dolorem accusamus corrupti
            molestias pariatur? Soluta.
        </p>
    </div>

</body>

</html>
