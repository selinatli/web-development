<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>araç liste fiyatları</title>
</head>

<body>
    <table border="3"width="50%">
        <thead>
            <tr>
                <th>arac adı</th>
                <th>fiyatı</th>
                <th>açıklama</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>x</td>
                <td>100.000 $</td>
                <td>açıklama 1 açıklama 1</td>
            </tr>
            <tr>
                <td colspan="2">açıklama 2 açıklama 2</td>
            </tr>
            <tr>
                <td>z</td>
                <td>300.000 $</td>
                <td>açıklama 3 açıklama 3</td>
            </tr>




        </tbody>
    </table>

</body>

</html>
