<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste Biçimlendirme</title>
    <style>

        ul{
            border: 3px solid rosybrown;
            border-radius: 10px;
            padding: 20px;
            background-color: darkgray;
        }

        li{
            padding: 10px;
            background-color: lightcoral;
            margin: 10px;
            border-radius: 10px;
            border-left: 10px solid rebeccapurple;
        }
    </style>
</head>
<body>
    <ul>
        <li>web programlama</li>
        <li>görsel programlama</li>
        <li>algoritma</li>
    </ul>
</body>
</html>
