<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Kartı</title>
    <style>

        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        .profil_kartı{
            border: 2px solid palevioletred;
            border-radius: 15px;
            padding: 10px;
            width: 350px;
            position: relative;
            margin: 25px 0 0 0;
            background-color: plum;   
        }
        .bildirim-sayısı{
            text-align: center;
            position: absolute;
            top: -10px;
            right: -8px;
            width: 20px;
            background-color: fuchsia;
            color: white;
            padding: 3px;
            border-radius: 5px;

        }

        .mesaj-button{
            padding: 5px 10px;
            border-radius: 10px;
            background-color: darksalmon;
            color: aliceblue;
        }
    </style>
</head>
<body>
    <div class="profil_kartı">
     <img
      src="profil.jpg"
      alt="profil_resmi"
      width="55"
      style="border: 1px solid lightpink;border-radius: 10px;"/>
    <h1>Selin Atlı</h1>
    <button class="mesaj-button">Mesaj Gönder</button>
    <p>Doğuş Üniversitesi Öğrencisi</p>
    <span class="bildirim-sayısı">5</span>
    </div>
</body>
</html>
