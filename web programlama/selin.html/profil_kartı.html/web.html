<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Kartı</title>
    <style>
        .profil_kartı{
            border: 2px solid darkblue;
            border-radius: 10px;
            width: 350px;
            padding: 10px;
            margin: 25px 0 0 10px;
            position: relative;
            background-color: cadetblue;
        }
        .mesaj-button{
            border-radius: 10px;
            padding: 5px 10px;
            background-color: darkgrey;
            color: azure;
        }
        .bildirim-sayısı{
            text-align: center;
            position: absolute;
            top: -10px;
            right: -8px;
            width: 20px;
            background-color: chartreuse;
            color: azure;
            border-radius: 5px;
            padding: 5px;
        }
    </style>
</head>
<body>
    <div class="profil_kartı">
    <img 
    src="profil.jpg" 
    width="55"
    alt="profil_resmi"
    style="border: 1px solid lightblue; border-radius: 10px;">
    <h1>Selin Atlı</h1>
    <button class="mesaj-button">Gönder</button>
    <p>Doğuş Üniversitesi Öğrencisi</p>
    <span class="bildirim-sayısı">6</span>
 </div>
</body>
</html>
