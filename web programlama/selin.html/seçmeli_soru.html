<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seçmeli Soru</title>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th></th>
                <th>Etiket</th>
                <th>Görevi</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th>I</th>
                <td>&lt;h1&gt;</td>
                <td>İlk seviye başlık</td>
            </tr>
            <tr>
                <th>II</th>
                <td>&lt;a&gt;</td>
                <td>Bağlantı etiketi</td>
            </tr>
            <tr>
                <th>III</th>
                <td>&lt;u&gt;</td>
                <td>Sırasız liste etiketi</td>
            </tr>
            <tr>
                <th>IV</th>
                <td>&lt;p&gt;</td>
                <td>Paragraf etiketi</td>
            </tr>
            <tr>
                <th>V</th>
                <td>&lt;b&gt;</td>
                <td>Alt satıra geçer</td>
            </tr>
        </tbody>
    </table>
    <p>Yukarıda HTML elemenleti ve yanlarında görevleri verilmiştir.</p>
    <p><b><u>Yanlış</u> olan element hangisidir?</b></p>
    <form>
        <ol style="list-style-type: lower-alpha">
            <li>
                <input type="radio" name="şıklar" id="a" />
                <label for="a">I ve II</label>
            </li>
            <li>
                <input type="radio" name="şıklar" id="b" />
                <label for="b">II ve III</label>
            </li>
            <li>
                <input type="radio" name="şıklar" id="c" />
                <label for="c">Yalnız III</label>
            </li>
            <li>
                <input type="radio" name="şıklar" id="d" />
                <label for="d">III ve V</label>
            </li>
            <li>
                <input type="radio" name="şıklar" id="e" />
                <label for="e">IV ve V</label>
            </li>
        </ol>
        <button type="submit">Gönder</button>

    </form>

    

</body>
</html>
