<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floating divs</title>

    <style>

        #container{
            background-color: darkgray;
            width: auto;
        }

        div{
            width: 150px;
            height: 150px;
            margin: 5px;
            overflow: auto;
        }

        #birinci {
            background-color: blueviolet;
            float: left;
        }

        #ikinci {
            background-color: aquamarine;
            float: left;
        }

        #üçüncü {
            background-color: brown;
            float: left;
        }

        #dördüncü {
            background-color: chartreuse;
            float: left;
        }
    </style>
</head>

<body>

    <div id="container">
        <div id="birinci"></div>
        <div id="ikinci"></div>
        <div id="üçüncü"></div>
        <div id="dördüncü"></div>
    </div>
</body>

</html>
